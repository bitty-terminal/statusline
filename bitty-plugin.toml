# Bitty plugin manifest.
#
# File name, keys, and limits are the accepted v1 contract in bitty-docs
# `docs/specifications/plugin-platform-rfc.md` (OQ-012). The plugin manager and
# the host parse this file independently before any plugin code runs.
#
# `just manifest` validates this file; `bitty-plugin-lint` from
# bitty-plugin-sdk (R-SDK-2) is the authoritative check against the same
# accepted contract.

[plugin]
id = "bitty-terminal.statusline"
name = "Statusline"
version = "0.0.1"
description = "Cwd, mode, Git and task presentation via status-component composition"
license = "MIT"

[compat]
# Unchanged from the bundled `bitty-terminal.statusline` realization.
bitty = ">=0.1,<1.0"
plugin-api = "^1.0"

[capabilities]
# Deny by default: omit this table entirely when the plugin needs no authority.
# Unknown identifiers fail validation and there is no allow-all identifier.
#
# `terminal.semantic-read` gates `bitty.terminal.snapshot`, the read-only
# committed-state observation the statusline composes from. `ui.rich` gates
# `bitty.ui.mount`/`bitty.ui.update` on the `statusline` slot. Both identifiers
# are unchanged from the bundled manifest.
terminal.semantic-read = true
ui.rich = true

[lazy]
# Static triggers let the host register the plugin without creating a VM.
# The statusline has no commands; the manifest-declared observation events
# activate and drive recomposition. Every kind is in the closed v1 event set
# (`bitty-plugin-sdk` EVENT_KINDS) and matches `statusline.format`
# `REACTIVE_EVENTS`, which `init.lua` subscribes through `is_reactive_event`:
# cwd, title, focus (pane/tab switches) and terminal open. Focus and open were
# added for the v1 hardening wave; cwd/title are unchanged from the bundled
# manifest.
events = ["terminal.cwd-changed", "terminal.title-changed", "focus.changed", "terminal.opened"]
